name: Deploy Frontend

on:
  push:
    branches:
      - main
      - master
    paths:
      - "Frontend/Boss/**"
      - "deploy/docker/frontend.Dockerfile"
      - "deploy/nginx/frontend.conf"
      - "deploy/docker-compose.frontend.prod.yml"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and Push Frontend Image
    runs-on: ubuntu-latest
    outputs:
      fifa_frontend_image: ${{ steps.image-names.outputs.fifa_frontend_image }}
      api_base_url: ${{ steps.urls.outputs.api_base_url }}
      auth_base_url: ${{ steps.urls.outputs.auth_base_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image name
        id: image-names
        shell: bash
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo="$(basename "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "fifa_frontend_image=ghcr.io/${owner}/${repo}-fifa-frontend" >> "$GITHUB_OUTPUT"

      - name: Prepare frontend API URLs
        id: urls
        shell: bash
        run: |
          api_base_url="${{ vars.API_BASE_URL }}"
          auth_base_url="${{ vars.AUTH_BASE_URL }}"

          if [ -z "$api_base_url" ]; then
            api_base_url="https://api.appzihub.fun"
          fi

          if [ -z "$auth_base_url" ]; then
            auth_base_url="https://auth.appzihub.fun"
          fi

          echo "api_base_url=${api_base_url}" >> "$GITHUB_OUTPUT"
          echo "auth_base_url=${auth_base_url}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/frontend.Dockerfile
          push: true
          build-args: |
            API_BASE_URL=${{ steps.urls.outputs.api_base_url }}
            AUTH_BASE_URL=${{ steps.urls.outputs.auth_base_url }}
          tags: |
            ${{ steps.image-names.outputs.fifa_frontend_image }}:${{ github.sha }}
            ${{ steps.image-names.outputs.fifa_frontend_image }}:latest

  deploy:
    name: Deploy Frontend to VPS
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare frontend directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          timeout: 120s
          script: mkdir -p /opt/fifa/frontend

      - name: Copy frontend compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          timeout: 120s
          source: deploy/docker-compose.frontend.prod.yml
          target: /opt/fifa/frontend
          strip_components: 1

      - name: Pull and restart frontend
        uses: appleboy/ssh-action@v1.2.0
        env:
          FIFA_FRONTEND_IMAGE: ${{ needs.build.outputs.fifa_frontend_image }}:${{ github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
          TLS_EXTRA_DOMAINS: ${{ vars.TLS_EXTRA_DOMAINS }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          timeout: 120s
          envs: FIFA_FRONTEND_IMAGE,GHCR_USERNAME,GHCR_TOKEN,LETSENCRYPT_EMAIL,TLS_EXTRA_DOMAINS
          script: |
            set -eu

            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sh
            fi

            cd /opt/fifa/frontend
            cat > .env <<EOF
            FIFA_FRONTEND_IMAGE=${FIFA_FRONTEND_IMAGE}
            EOF

            docker network create fifa-public >/dev/null 2>&1 || true

            mkdir -p /opt/fifa/certbot/conf /opt/fifa/certbot/www

            certbot_domains="-d fifa.appzihub.fun -d api.appzihub.fun -d auth.appzihub.fun"
            if [ -n "${TLS_EXTRA_DOMAINS:-}" ]; then
              old_ifs="$IFS"
              IFS=","
              for domain in ${TLS_EXTRA_DOMAINS}; do
                domain="$(printf '%s' "${domain}" | xargs)"
                if [ -n "${domain}" ]; then
                  certbot_domains="${certbot_domains} -d ${domain}"
                fi
              done
              IFS="$old_ifs"
            fi

            if [ -n "${LETSENCRYPT_EMAIL:-}" ]; then
              certbot_email_args="--email ${LETSENCRYPT_EMAIL}"
            else
              certbot_email_args="--register-unsafely-without-email"
            fi

            docker compose -f docker-compose.frontend.prod.yml down || true

            if [ ! -f /opt/fifa/certbot/conf/live/fifa.appzihub.fun/fullchain.pem ]; then
              docker run --rm \
                -p 80:80 \
                -v /opt/fifa/certbot/conf:/etc/letsencrypt \
                -v /opt/fifa/certbot/www:/var/www/certbot \
                certbot/certbot certonly \
                  --standalone \
                  --preferred-challenges http \
                  --non-interactive \
                  --agree-tos \
                  ${certbot_email_args} \
                  ${certbot_domains}
            else
              docker run --rm \
                -p 80:80 \
                -v /opt/fifa/certbot/conf:/etc/letsencrypt \
                -v /opt/fifa/certbot/www:/var/www/certbot \
                certbot/certbot renew \
                  --standalone \
                  --non-interactive || true
            fi

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
            docker compose -f docker-compose.frontend.prod.yml pull
            docker compose -f docker-compose.frontend.prod.yml up -d --remove-orphans
            docker image prune -f
