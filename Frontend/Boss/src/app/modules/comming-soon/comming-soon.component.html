<div class="bgimg w3-display-container w3-animate-opacity w3-text-white">
  <div class="w3-display-topleft w3-padding-large w3-xlarge">
  </div>
  <div class="w3-display-middle">
    <h1 class="w3-jumbo w3-animate-top">{{'soon.comingSoon' | translate}}</h1>
    <hr class="w3-border-grey" style="margin:auto;width:40%">
    <h2 class="w3-large w3-center">{{days}} {{'common.days' | translate}} {{hours
      <10?'0':''}}{{hours}} : {{minutes<10?'0':''}}{{minutes}} : {{seconds<10?'0':''}}{{seconds}}</h2>
  </div>
  <div class="w3-display-bottommiddle w3-padding-large">
    <p class="w3-large w3-center">{{'soon.organizedBy' | translate}}</p>
  </div>
</div>
