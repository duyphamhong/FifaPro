<div class="main-wrapper">
    <mat-card class="box">
      <mat-card-header>
        <mat-card-title>Sign In</mat-card-title>
      </mat-card-header>
      <form class="form-width" [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-card-content>
          <mat-form-field class="field-full-width">
            <input matInput placeholder="Username" formControlName="userName">
          </mat-form-field>
  
          <mat-form-field class="field-full-width">
            <input matInput type="password" placeholder="Password" formControlName="password">
          </mat-form-field>
        </mat-card-content>
        <button mat-stroked-button color="accent" class="btn-block" type="submit">Sign-in</button>
      </form>
    </mat-card>
  
  </div>
