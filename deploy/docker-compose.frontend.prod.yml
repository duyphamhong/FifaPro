name: fifa-frontend

services:
  fifa-frontend:
    image: ${FIFA_FRONTEND_IMAGE}
    ports:
      - "${FIFA_FRONTEND_PORT:-80}:80"
      - "${FIFA_FRONTEND_HTTPS_PORT:-443}:443"
    volumes:
      - /opt/fifa/certbot/conf:/etc/letsencrypt:ro
      - /opt/fifa/certbot/www:/var/www/certbot:ro
    networks:
      - fifa-public
    restart: unless-stopped

networks:
  fifa-public:
    external: true
