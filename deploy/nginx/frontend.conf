server {
  listen 80;
  server_name api.appzihub.fun;
  resolver 127.0.0.11 ipv6=off valid=30s;

  location / {
    set $fifa_api http://fifa-api:8080;
    proxy_pass $fifa_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

server {
  listen 80;
  server_name auth.appzihub.fun;
  resolver 127.0.0.11 ipv6=off valid=30s;

  location / {
    set $fifa_identity_api http://fifa-identity-api:8080;
    proxy_pass $fifa_identity_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 80;
  server_name app.appzihub.fun fifa.appzihub.fun;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
