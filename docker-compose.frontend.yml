name: fifa-frontend

services:
  fifa-frontend:
    image: ${FIFA_FRONTEND_IMAGE:-fifa-frontend:latest}
    build:
      context: ./Frontend/Boss
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:6001}
        AUTH_BASE_URL: ${AUTH_BASE_URL:-http://localhost:5001}
      dockerfile_inline: |
        FROM node:16-alpine AS build
        WORKDIR /app
        COPY package*.json ./
        RUN npm ci
        COPY angular.json tsconfig*.json ./
        COPY src ./src
        ARG API_BASE_URL
        ARG AUTH_BASE_URL
        RUN node -e "const fs=require('fs'); const [api, auth]=process.argv.slice(1); fs.writeFileSync('src/environments/environment.prod.ts', 'export const environment = {\n  production: true,\n  baseApiUrl: \"' + api + '\",\n  baseAuthenUrl: \"' + auth + '\"\n};\n');" "$$API_BASE_URL" "$$AUTH_BASE_URL"
        RUN npm run build

        FROM nginx:1.27-alpine AS final
        COPY --from=build /app/dist/boss /usr/share/nginx/html
        RUN printf '%s\n' \
          'server {' \
          '  listen 80;' \
          '  server_name _;' \
          '  root /usr/share/nginx/html;' \
          '  index index.html;' \
          '  location / {' \
          '    try_files $$uri $$uri/ /index.html;' \
          '  }' \
          '}' > /etc/nginx/conf.d/default.conf
        EXPOSE 80
    ports:
      - "${FIFA_FRONTEND_PORT:-4200}:80"
    restart: unless-stopped
